<!-- Aviator frames. Lens centres at roughly (78,50) and (202,50): src/main.js relies on these -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="100" viewBox="0 0 280 100">
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(60,40,20)" stop-opacity="0.6"/>
      <stop offset="1" stop-color="rgb(60,40,20)" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- One teardrop lens, then the same shape mirrored for the other side -->
  <g id="lens" fill="url(#tint)" stroke="#b8902f" stroke-width="4">
    <path d="M30 32 Q32 16 78 17 Q126 18 126 36 Q126 80 88 86 Q40 90 32 58 Z"/>
  </g>
  <use href="#lens" transform="translate(280 0) scale(-1 1)"/>
  <g fill="none" stroke="#b8902f" stroke-width="4" stroke-linecap="round">
    <path d="M126 32 Q140 26 154 32"/>
    <path d="M116 19 L164 19"/>
    <path d="M30 30 L4 26"/>
    <path d="M250 30 L276 26"/>
  </g>
</svg>
