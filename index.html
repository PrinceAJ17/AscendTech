<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasses Try-On</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Glasses Try-On <span class="tag">prototype</span></h1>
    </header>

    <main>
      <section class="stage" aria-label="Camera view">
        <video id="video" playsinline muted></video>
        <!-- Three.js draws the 3D glasses here (transparent background) -->
        <canvas id="three"></canvas>
        <!-- 2D glasses (baseline mode) and debug landmark dots -->
        <canvas id="overlay"></canvas>
        <p id="placeholder" class="placeholder">Camera is off</p>
      </section>

      <aside class="panel">
        <button id="cameraBtn" class="primary">Start camera</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>

        <h2>Glasses</h2>
        <div id="glassesList" class="glasses-list">
          <button data-id="round" aria-pressed="true">Round</button>
          <button data-id="rectangle" aria-pressed="false">Rectangle</button>
          <button data-id="aviator" aria-pressed="false">Aviator</button>
        </div>

        <h2>Debug</h2>
        <label class="toggle"><input type="checkbox" id="use3D" checked /> 3D glasses (off = 2D baseline)</label>
        <label class="toggle"><input type="checkbox" id="showLandmarks" /> Show landmarks</label>
        <label class="toggle"><input type="checkbox" id="showOccluder" /> Show occluder</label>
        <label class="slider">Pitch correction <output id="pitchOut">0°</output>
          <input type="range" id="pitch" min="-30" max="30" step="1" value="0" />
        </label>
        <label class="slider">Occluder height <output id="occHeightOut">–</output>
          <input type="range" id="occHeight" min="-60" max="40" step="1" />
        </label>

        <h2>Stats</h2>
        <dl class="stats">
          <dt>Resolution</dt><dd id="statRes">–</dd>
          <dt>Camera FPS</dt><dd id="statFps">–</dd>
          <dt>Inference</dt><dd id="statInference">–</dd>
          <dt>Render</dt><dd id="statRender">–</dd>
          <dt>Face</dt><dd id="statFace">–</dd>
          <dt>Runs on</dt><dd id="statDelegate">–</dd>
          <dt>Selected</dt><dd id="statGlasses">round</dd>
        </dl>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
